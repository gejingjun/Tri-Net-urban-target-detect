[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfgnet"
version = "1.0.0"
description = "TFG-Net: Tri-Modal Feature-Guided Fusion with Robust Uncertainty Gating for Urban Object Detection in Degraded Environments"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jingjun Ge" }]
keywords = ["object-detection", "multimodal", "rgb-ir-depth", "yolo", "fusion"]
dependencies = [
  "torch>=2.1.0,<3.0",
  "torchvision>=0.16.0",
  "numpy>=1.24,<3.0",
  "opencv-python>=4.8.0",
  "Pillow>=10.0.0",
  "PyYAML>=6.0",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "pycocotools>=2.0.7",
  "thop>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
